[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."cleanup-shares"]
  schedule = "0 * * * *"

[[redirects]]
  from = "/snapbooth_photobooth_app.html"
  to = "/"
  status = 301

[[headers]]
  for = "/shared.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
